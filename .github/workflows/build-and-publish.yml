name: Build and publish Flatpak repo

on:
  push:
    branches: [main]
    paths:
      - "io.github.roccorakete.AnycubicSlicerNext.yml"
      - "io.github.roccorakete.AnycubicSlicerNext.appdata.xml"
      - "io.github.roccorakete.AnycubicSlicerNext.desktop"
      - "anycubic-slicer-next"
      - "patches/**"
      - ".github/workflows/build-and-publish.yml"
  schedule:
    # Weekly check for an upstream .deb update.
    - cron: "17 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-update:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: update
        run: |
          ./update-anycubic-slicer.sh
          if git diff --quiet -- io.github.roccorakete.AnycubicSlicerNext.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "Update Anycubic Slicer Next .deb pin"
            git push
          fi

  build:
    needs: [check-update]
    if: always() && (github.event_name != 'schedule' || needs.check-update.outputs.changed == 'true')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Free up disk space
        run: |
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: anycubic-slicer-next.flatpak
          manifest-path: io.github.roccorakete.AnycubicSlicerNext.yml
          cache-key: flatpak-builder-${{ github.sha }}
          build-bundle: false
          repository-name: flathub
          repository-url: https://flathub.org/repo/flathub.flatpakrepo

      - name: Build and sign repo with flatter
        uses: andyholmes/flatter@main
        with:
          files: io.github.roccorakete.AnycubicSlicerNext.yml
          gpg-sign: ${{ secrets.GPG_SIGN_KEY }}
          upload-pages-artifact: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
