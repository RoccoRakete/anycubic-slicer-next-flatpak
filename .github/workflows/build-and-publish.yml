name: Build and publish Flatpak repo

on:
  push:
    branches: [main]
    paths:
      - "io.github.roccorakete.AnycubicSlicerNext.yml"
      - "io.github.roccorakete.AnycubicSlicerNext.appdata.xml"
      - "io.github.roccorakete.AnycubicSlicerNext.desktop"
      - "anycubic-slicer-next"
      - "patches/**"
      - ".github/workflows/build-and-publish.yml"
  schedule:
    # Weekly check for an upstream .deb update.
    - cron: "17 4 * * 1"
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Only runs on the weekly schedule: bumps the manifest's url/sha256 pin (and the
  # appdata.xml release entry) if Anycubic has shipped a newer .deb, tags the commit, and
  # pushes -- which in turn triggers the `build` job via the `push` trigger above.
  check-update:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          ./update-anycubic-slicer.sh
          if git diff --quiet -- io.github.roccorakete.AnycubicSlicerNext.yml; then
            echo "no update available"
            exit 0
          fi
          version="$(grep -m1 '<release version="' io.github.roccorakete.AnycubicSlicerNext.appdata.xml | sed -E 's/.*version="([^"]+)".*/\1/')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Update Anycubic Slicer Next to $version"
          git tag "v$version"
          git push --follow-tags

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - name: Allow unprivileged user namespaces
        # bubblewrap (used by flatpak-builder) needs this on Ubuntu 24.04+ runners, where
        # AppArmor restricts unprivileged user namespace creation by default. Non-fatal if
        # the sysctl key doesn't exist on whatever runner image is current.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install flatpak, flatpak-builder, and the GNOME 50 SDK
        # No prebuilt container has a GNOME 50 image yet (flathub-infra tops out at 48,
        # andyholmes/flatter at 49/master) -- installing fresh here avoids depending on one
        # existing and matches exactly what's verified working in local testing.
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Import GPG signing key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_SIGN_KEY }}

      - name: Build and publish repo with flatter
        id: flatter
        uses: andyholmes/flatter@v1
        with:
          files: io.github.roccorakete.AnycubicSlicerNext.yml
          gpg-sign: ${{ steps.gpg.outputs.fingerprint }}
          upload-pages-artifact: true

      - name: Build distributable bundle
        # Same artifact build-bundle.sh produces locally -- for the GitHub Release, as an
        # alternative to `flatpak remote-add` for people who just want a file to double-click.
        run: |
          flatpak build-bundle \
            --gpg-sign=${{ steps.gpg.outputs.fingerprint }} \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            "${{ steps.flatter.outputs.repository }}" \
            anycubic-slicer-next.flatpak \
            io.github.roccorakete.AnycubicSlicerNext master

      - name: Determine version
        id: version
        run: |
          version="$(grep -m1 '<release version="' io.github.roccorakete.AnycubicSlicerNext.appdata.xml | sed -E 's/.*version="([^"]+)".*/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Anycubic Slicer Next ${{ steps.version.outputs.version }}
          files: anycubic-slicer-next.flatpak
          make_latest: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
